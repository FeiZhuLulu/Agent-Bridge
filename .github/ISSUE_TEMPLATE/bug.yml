name: Bug
description: Something is broken
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got. Chinese is fine.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, agent name, and relevant logs (no secrets).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / macOS / Ubuntu
  - type: input
    id: python
    attributes:
      label: Python / uv version
