[project]
name = "agent-bridge"
version = "0.1.0"
description = "Connect local coding agents. Codex coordinates Antigravity CLI, Grok Build, and DeepSeek Harness."
readme = "README.md"
license = "MIT"
authors = [{ name = "FeiZhuLulu" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "agent-client-protocol>=0.12.0",
    "pydantic>=2.7",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/FeiZhuLulu/Agent-Bridge"
Repository = "https://github.com/FeiZhuLulu/Agent-Bridge"

[project.scripts]
agent-bridge = "agent_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"agents.toml" = "agent_bridge/agents.toml"
"src/agent_bridge/share/dsh-acp.cordis.yml" = "agent_bridge/share/dsh-acp.cordis.yml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
