[project]
name = "agent-bridge"
version = "0.1.0"
description = "Connect local coding agents. Codex, Cursor, Kimi Code, ZCode, Grok Build, or Claude Code coordinates Antigravity CLI, Grok Build, Kimi Code, DeepSeek Harness, OpenCode, Claude Code, and Codex CLI."
readme = "README.md"
license = "MIT"
authors = [{ name = "FeiZhuLulu" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "agent-client-protocol>=0.12.0",
    "pydantic>=2.7",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.5",
]

[project.urls]
Homepage = "https://github.com/FeiZhuLulu/Agent-Bridge"
Repository = "https://github.com/FeiZhuLulu/Agent-Bridge"

[project.scripts]
agent-bridge = "agent_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"src/agent_bridge/share/dsh-acp.cordis.yml" = "agent_bridge/share/dsh-acp.cordis.yml"
"skills/agent-bridge/SKILL.md" = "agent_bridge/share/skills/agent-bridge/SKILL.md"
"ORCHESTRATION.md" = "agent_bridge/share/ORCHESTRATION.md"
"ORCHESTRATION.zh-CN.md" = "agent_bridge/share/ORCHESTRATION.zh-CN.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 120

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "E501",     # long lines: docstrings and tool descriptions are prose
    "ASYNC109", # explicit timeout parameters are part of the adapter API
    "ASYNC240", # sync pathlib in async code is tracked separately (state/transcript IO work)
    "SIM112",   # Windows OneDrive env var is mixed-case; ONEDRIVE would misdocument it
]

[tool.ruff.lint.per-file-ignores]
# These files inject sys.path before importing local helpers; the import cannot sit at the top.
"scripts/install_dsh_acp.py" = ["E402"]
"tests/test_setup_lab.py" = ["E402"]
"tests/test_smoke_claude_coordinator.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/agent_bridge"]
ignore_missing_imports = true
warn_unused_ignores = true
